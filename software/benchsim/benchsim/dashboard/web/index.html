<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wet Lab Bench Live</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <div class="brand">Wet Lab Bench <span id="brand-mode" class="muted">· live</span></div>
  <span id="mode" class="badge">SIM</span>
  <span id="state" class="pill">connecting…</span>
  <span id="clock" class="metric">t = –</span>
  <span id="rtf" class="metric muted live-only"></span>
  <span class="grow"></span>
  <span id="speeds" class="speeds" role="group" aria-label="Playback speed"></span>
  <span id="toast" class="muted"></span>
  <button class="live-only" id="btn-start" data-cmd="start">Start</button>
  <button id="btn-stop" data-cmd="stop" class="danger live-only">Stop</button>
  <button class="live-only" id="btn-reset" data-cmd="reset">Reset</button>
  <button id="btn-theme" title="Light / dark" aria-label="Toggle light or dark theme">◐</button>
</header>

<main class="grid">
  <section class="left">
    <div class="stage">
      <img id="video" alt="Simulated bench camera">
      <div id="novideo" class="novideo">no camera stream</div>
      <div id="banner" class="banner" hidden></div>
      <div id="armtag" class="armtag" hidden></div>
      <div id="cams" class="cams live-only" role="group" aria-label="Camera"></div>
      <div class="caption">
        <div id="cap-step" class="cap-step"></div>
        <div id="cap-title" class="cap-title">Waiting for the bench…</div>
        <div id="cap-meter" class="meter" hidden>
          <div class="meter-track"><div id="cap-band" class="meter-band"></div><div id="cap-fill" class="meter-fill"></div><div id="cap-target" class="meter-target"></div></div>
          <div id="cap-meter-text" class="meter-text"></div>
        </div>
      </div>
    </div>
    <div id="runner" class="runner muted small"></div>
    <div class="low">
      <article class="card" id="card-chem">
        <h2>Chemistry</h2>
        <div id="chem-legend" class="legend small"></div>
        <div id="chem" class="secondary small">Vessel contents appear with the full demo runner.</div>
        <div id="foam" class="facts-row small"></div>
      </article>
      <article class="card" id="card-wire">
        <h2 title="laptop ⇄ Mega (JSON lines) · laptop → arm servo buses. → sent · ← received. 'sampled' lines stand for streams: arm goals go out at 50 Hz and scale samples come in at 80 Hz, shown about once per 0.5 s and 1 s.">Wire <span class="muted small">laptop ⇄ Mega · servo buses</span></h2>
        <div id="wire" class="wire"></div>
      </article>
    </div>
  </section>

  <section class="right">
    <article class="card" id="card-run">
      <h2>Run</h2>
      <div class="run-scroll">
        <div id="run-head" class="run-head"></div>
        <div class="run-body">
          <button id="run-more" class="run-more" hidden></button>
          <ol id="run-steps" class="run-steps"></ol>
        </div>
      </div>
    </article>
    <article class="card" id="card-twin">
      <h2 title="Commanded vs measured. Servo encoders report where each servo believes it is, so a tracking error shows here. A wrong zero offset does not, because commanded and measured agree while the real arm is off; the grasp and scale checks catch that.">Arms <span class="muted small">plan vs servos</span></h2>
      <div id="twin" class="secondary small">–</div>
    </article>
    <article class="card" id="card-errors">
      <h2>Errors &amp; checks</h2>
      <ul id="errors" class="errors"><li class="muted">none</li></ul>
    </article>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
